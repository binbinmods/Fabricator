[config]
schemaVersion = "1.2.1"

[package]
namespace = "Binbin"
name = "Steel_Spartan_The_Fabricator"
versionNumber = "1.2.1"
description = "New Hero Mod for the Steel Spartan, the Fabricator, a hero who uses Turrets and Enchantments to boost damage and survivability."
websiteUrl = "https://github.com/binbinmods/Fabricator"
containsNsfwContent = false

[package.dependencies]
meds-Obeliskial_Essentials = "1.5.1"
meds-Obeliskial_Content = "1.5.6"


[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./Fabricator"
target = ""


[publish]
repository = "https://thunderstore.io"
communities = [ "across-the-obelisk", ]
[publish.categories]
across-the-obelisk = [ "mods", ]


